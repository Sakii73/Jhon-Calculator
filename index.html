<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK Gold Price</title>
<style>
  /* Light palette copied from the desktop program (gui.py), so the two look alike.
     Mobile-first so it also reads well in Safari on an iPhone. No layout libraries. */
  :root{
    --bg:#eef1f6; --card:#ffffff; --border:#d7deea;
    --navy:#14213d; --navy-hover:#26396a; --gold:#d4af37; --gold-ink:#8a6d1f;
    --green:#15803d; --orange:#b45309; --red:#b91c1c; --grey:#6b7280; --ink:#1c2433;
    --tint-green:#e3f3e8; --tint-red:#fde6e6; --tint-blue:#e8ecf3;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; padding:16px;
  }
  .wrap{max-width:560px; margin:0 auto}

  /* dark navy header bar, like the desktop header */
  .head{background:var(--navy); color:#fff; border-radius:14px 14px 0 0;
        padding:16px 18px; border:1px solid var(--navy)}
  .head h1{font-size:19px; margin:0; font-weight:600}
  .head h1 span{color:var(--gold)}
  .head .sub{color:#c9d3e8; font-size:12.5px; margin-top:4px}

  .card{background:var(--card); border:1px solid var(--border); border-top:0;
        padding:16px 18px}
  .card.sep{border-top:1px solid var(--border); border-radius:0 0 14px 14px}
  .card.mt{border-top:1px solid var(--border); border-radius:14px; margin-top:14px}

  /* price block with a gold accent stripe on the left */
  .pricebox{border-left:4px solid var(--gold); padding-left:14px}
  .price{font-size:44px; font-weight:700; color:var(--navy); letter-spacing:.5px; line-height:1.1}
  .price small{font-size:16px; color:var(--grey); font-weight:500}
  .asof{color:var(--grey); font-size:14px; margin-top:6px}

  pre.block{background:#f5f7fb; border:1px solid var(--border); border-radius:10px;
        padding:12px; font-size:15px; margin:14px 0 0; white-space:pre-wrap;
        font-family:Consolas,Menlo,monospace; color:var(--ink)}

  .row{display:flex; gap:10px; margin-top:14px}
  button{font:inherit; font-weight:600; border:1px solid transparent; border-radius:10px;
        padding:12px 16px; cursor:pointer; flex:1}
  .go{background:var(--navy); color:#fff}
  .go:hover{background:var(--navy-hover)}
  .go:disabled{opacity:.6; cursor:default}
  .ghost{background:#fff; color:var(--navy); border:1px solid var(--border); flex:0 0 auto}
  .ghost:hover{background:#f3f6fb}
  .count{color:var(--grey); font-size:13px; margin-top:10px; text-align:center}

  details{margin-top:12px; border-top:1px solid var(--border); padding-top:10px}
  summary{cursor:pointer; color:var(--navy); font-size:14px; font-weight:600}
  .steps{font-family:Consolas,Menlo,monospace; font-size:13px; margin:10px 0 0; padding:0; list-style:none; color:var(--ink)}
  .steps li{padding:2px 0}
  .sources{color:var(--grey); font-size:13px; white-space:pre-wrap; margin-top:10px}

  .banner{border-radius:10px; padding:11px 12px; font-size:14px; margin:0 0 0; display:none}
  .banner.err{background:var(--tint-red); border:1px solid #f1c4c4; color:var(--red); display:block}
  .banner.load{background:var(--tint-blue); border:1px solid #cdd6e8; color:var(--navy); display:block}
  .bwrap{padding:14px 18px 0}

  table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px}
  th,td{text-align:left; padding:6px 4px; border-bottom:1px solid var(--border)}
  th{color:var(--navy); font-weight:600}
  td.hk{color:var(--gold-ink); font-weight:700}
  .hist-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
  .hist-head strong{color:var(--ink)}
  .mini{font-size:12px; padding:8px 11px; flex:0 0 auto}
  .empty{color:var(--grey); font-size:13px; margin-top:10px}
</style>
<!-- SheetJS fork with cell styling, for the formatted Excel export (loaded from a CDN) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>HK Gold Price <span>&#9679;</span></h1>
    <div class="sub">USD&rarr;PHP from XE &middot; gold Bid from Kitco &middot; recalculates every 15 minutes while open</div>
  </div>

  <div class="bwrap card" style="border-bottom:0; padding-bottom:0">
    <div id="banner" class="banner"></div>
  </div>

  <div class="card">
    <div class="pricebox">
      <div id="price" class="price">&mdash;<small> /gram</small></div>
      <div id="asof" class="asof">Not calculated yet.</div>
    </div>
    <pre id="block" class="block">Press "Calculate now" to read the current price.</pre>

    <div class="row">
      <button id="go" class="go">Calculate now</button>
    </div>
    <div id="count" class="count"></div>

    <details>
      <summary>Show the computation</summary>
      <ul id="steps" class="steps"></ul>
      <div id="sources" class="sources"></div>
    </details>
  </div>

  <div class="card sep">
    <div class="hist-head">
      <strong>History <span id="histcount" class="empty" style="margin:0"></span></strong>
      <div style="display:flex; gap:8px">
        <button id="xlsx" class="ghost mini">Export Excel</button>
        <button id="csv" class="ghost mini">CSV</button>
        <button id="clear" class="ghost mini">Clear</button>
      </div>
    </div>
    <div id="histbody"></div>
  </div>
</div>

<script>
"use strict";
// ---- settings -------------------------------------------------------------
var AUTO_MS = 15 * 60 * 1000;     // recalculate every 15 minutes while open
var KEY = "hk_history_v1";        // where history is kept IN THIS BROWSER
var CSV_HEAD = ["date","time","Us raw","Us","Gold","Hk","XE time","Kitco time"];
var XLS_HEAD = ["Date","Time","Us raw","Us","Gold","Hk","XE time","Kitco time"];

var autoTimer = null, nextAt = 0;

// ---- history (lives only in this browser, per device) ---------------------
function loadHistory(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ return []; }
}
function saveHistory(list){
  try { localStorage.setItem(KEY, JSON.stringify(list.slice(-2000))); }
  catch(e){ /* private mode etc.: history just won't persist */ }
}
function addRecord(rec){
  var list = loadHistory(); list.push(rec); saveHistory(list); renderHistory();
}

// ---- drawing --------------------------------------------------------------
function setBanner(kind, text){
  var b = document.getElementById("banner");
  b.className = "banner" + (kind ? " " + kind : "");
  b.textContent = text || "";
}
function peso(n){ return "₱" + Number(n).toLocaleString("en-US"); }

function render(p){
  document.getElementById("price").innerHTML = peso(p.hk) + "<small> /gram</small>";
  document.getElementById("block").textContent = p.block;
  document.getElementById("asof").textContent = p.sentence;
  var steps = document.getElementById("steps");
  steps.innerHTML = "";
  p.steps.forEach(function(line){
    var li = document.createElement("li"); li.textContent = line; steps.appendChild(li);
  });
  document.getElementById("sources").textContent = p.sources;
}

function renderHistory(){
  var list = loadHistory();
  var body = document.getElementById("histbody");
  document.getElementById("histcount").textContent = list.length ? "(" + list.length + ")" : "";
  if (!list.length){ body.innerHTML = '<div class="empty">No calculations saved yet on this device.</div>'; return; }
  var rows = list.slice().reverse().slice(0, 50);   // newest first, latest 50
  var html = '<table><tr><th>Date</th><th>Time</th><th>Us</th><th>Gold</th><th>Hk</th></tr>';
  rows.forEach(function(r){
    html += "<tr><td>" + r.date + "</td><td>" + r.time + "</td><td>" + r.us +
            "</td><td>" + r.gold + "</td><td class='hk'>" + Number(r.hk).toLocaleString("en-US") + "</td></tr>";
  });
  html += "</table>";
  if (list.length > 50) html += '<div class="empty">Showing the latest 50. Export for all ' + list.length + '.</div>';
  body.innerHTML = html;
}

// ---- countdown ------------------------------------------------------------
function schedule(){
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(calcNow, AUTO_MS);   // keep the 15-min rhythm
  nextAt = Date.now() + AUTO_MS;
}
setInterval(function(){
  if (!nextAt) return;
  var left = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
  var m = Math.floor(left / 60), s = left % 60;
  document.getElementById("count").textContent =
    "Next automatic update in " + m + ":" + (s < 10 ? "0" : "") + s;
}, 1000);

// ---- the one network call -------------------------------------------------
function calcNow(){
  schedule();                                  // pressing the button restarts the 15-min clock
  setBanner("load", "Reading XE and Kitco…");
  document.getElementById("go").disabled = true;
  fetch("/api/price", { cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(function(p){
      if (p.ok){ setBanner("", ""); render(p); addRecord(p.record); }
      // Same rule as the desktop: show the problem, do NOT compute with missing/old
      // values. The last good reading stays on screen.
      else { setBanner("err", p.error); }
    })
    .catch(function(e){
      setBanner("err", "Could not reach the server. Check your internet and try again. (" + e + ")");
    })
    .finally(function(){ document.getElementById("go").disabled = false; });
}

// ---- export: Excel (.xlsx, formatted) and CSV -----------------------------
function exportXLSX(){
  var list = loadHistory();
  if (!list.length){ setBanner("err", "No history to export yet."); return; }
  if (typeof XLSX === "undefined"){            // the CDN library didn't load: fall back
    setBanner("err", "The Excel library didn't load, so I saved a CSV instead.");
    exportCSV(); return;
  }
  var headStyle = { font:{bold:true, color:{rgb:"FFFFFF"}},
                    fill:{patternType:"solid", fgColor:{rgb:"14213D"}},
                    alignment:{horizontal:"left"} };
  var aoa = [ XLS_HEAD.map(function(h){ return {v:h, t:"s", s:headStyle}; }) ];
  list.forEach(function(r){
    aoa.push([
      {v:r.date, t:"s"},
      {v:r.time, t:"s"},
      {v:Number(r.us_raw), t:"n", z:"0.00000000"},
      {v:Number(r.us),     t:"n", z:"0.00"},
      {v:Number(r.gold),   t:"n", z:"0.00"},
      {v:Number(r.hk),     t:"n", z:"0"},
      {v:r.xe_time, t:"s"},
      {v:r.kitco_time, t:"s"}
    ]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:12},{wch:10},{wch:14},{wch:8},{wch:10},{wch:8},{wch:20},{wch:20}];
  ws["!autofilter"] = { ref: "A1:H" + (list.length + 1) };
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Records");
  XLSX.writeFile(wb, "records.xlsx");
}

function exportCSV(){
  var list = loadHistory();
  if (!list.length){ setBanner("err", "No history to export yet."); return; }
  var lines = [CSV_HEAD.join(",")];
  list.forEach(function(r){
    lines.push([r.date, r.time, r.us_raw, r.us, r.gold, r.hk, r.xe_time, r.kitco_time].join(","));
  });
  var blob = new Blob([lines.join("\r\n") + "\r\n"], { type: "text/csv" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "records.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

document.getElementById("go").addEventListener("click", calcNow);
document.getElementById("xlsx").addEventListener("click", exportXLSX);
document.getElementById("csv").addEventListener("click", exportCSV);
document.getElementById("clear").addEventListener("click", function(){
  if (confirm("Clear the saved history on this device?")){ saveHistory([]); renderHistory(); }
});

// ---- start ----------------------------------------------------------------
renderHistory();
calcNow();
</script>
</body>
</html>
